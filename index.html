<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วงล้อสลากรางวัล</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti"></canvas>
<div class="win-flash" id="winFlash"></div>

<!-- Result Modal -->
<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-icon">🎉</div>
    <p class="modal-sub">ผลการจับสลาก</p>
    <p class="modal-label" id="modalTitle">ผู้โชคดีคือ</p>
    <div class="modal-number" id="modalNumber" aria-live="assertive">—</div>
    <div class="modal-btn-row">
      <button class="modal-close modal-close--outline" onclick="closeModal()">✓ รับทราบ</button>
      <button class="modal-close" onclick="removeAndClose()">🗑 นำออก</button>
    </div>
  </div>
</div>

<div class="app">

  <!-- Header -->
  <header class="app-header">
    <h1>🎡 วงล้อ<span>สลาก</span>รางวัล</h1>
  </header>

  <!-- Main layout: wheel left, editor right -->
  <div class="app-body">

    <!-- LEFT: Wheel -->
    <div class="wheel-col">
      <div class="wheel-wrap">
          <canvas id="wheel" width="740" height="740"></canvas>
        <div class="wheel-pointer"></div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">
        <span class="spin-icon">▶</span> หมุนวงล้อ
      </button>

      <!-- History -->
      <div class="history-box">
        <div class="history-header">
          <span class="history-title">ผลล่าสุด</span>
          <button class="history-clear" type="button" onclick="clearHistory()">ล้าง</button>
        </div>
        <div class="history-list" id="historyList" aria-live="polite">
          <span class="empty-text">ยังไม่มีผล</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Editor -->
    <div class="editor-col">
      <div class="editor-toolbar">
        <button class="tool-btn" type="button" onclick="shuffleItems()" title="สุ่มลำดับ">⇄ Shuffle</button>
        <button class="tool-btn" type="button" onclick="sortItems()" title="เรียงลำดับ">↑↓ Sort</button>
        <button class="tool-btn" id="undoBtn" type="button" onclick="undoLastChange()" disabled>↶ Undo</button>
        <button class="tool-btn" type="button" onclick="document.getElementById('importFile').click()">นำเข้า</button>
        <input id="importFile" class="visually-hidden" type="file" accept=".json,.txt,application/json,text/plain" aria-label="เลือกไฟล์ JSON หรือ TXT" onchange="importItems(event)">
        <button class="tool-btn" type="button" onclick="exportItems()">ส่งออก</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" type="button" onclick="clearAll()" title="ล้างทั้งหมด">🗑 ล้างทั้งหมด</button>
        <span class="item-count" id="itemCount" aria-live="polite">0 รายการ</span>
      </div>

      <!-- The live-edit list -->
      <div class="entry-list" id="entryList"></div>

      <!-- Presets -->
      <div class="preset-bar">
        <span class="preset-label">เพิ่มด่วน:</span>
        <button class="preset-btn" type="button" onclick="addPreset('000-099')">000–099</button>
        <button class="preset-btn" type="button" onclick="addPreset('100-199')">100–199</button>
        <button class="preset-btn" type="button" onclick="addPreset('200-299')">200–299</button>
      </div>
    </div>

  </div>
</div>

<script src="main.js"></script>
</body>
</html>
