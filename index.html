<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จับสลากรางวัล</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti"></canvas>
<div class="win-flash" id="winFlash"></div>

<!-- Result Popup -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-icon">🎉</div>
    <p class="modal-eyebrow">ผลการจับสลาก</p>
    <p class="modal-title">หมายเลขที่ได้รับคือ</p>
    <div class="modal-digits-row">
      <div class="modal-digit-box" id="popDigit0"></div>
      <div class="modal-digit-box" id="popDigit1"></div>
      <div class="modal-digit-box" id="popDigit2"></div>
    </div>
    <button class="modal-close-btn" onclick="closeModal()">✓ รับทราบ</button>
  </div>
</div>

<div class="wrapper">

  <div class="header">
    <p class="eyebrow">ระบบจับสลาก</p>
    <h1>🎰 จับ<span>สลาก</span>รางวัล</h1>
  </div>

  <div class="machine">
    <div class="reels-row">
      <div class="reel-wrapper">
        <div class="reel" id="reel0">
          <div class="reel-strip" id="strip0"></div>
          <div class="reel-center-line"></div>
        </div>
      </div>
      <div class="reel-sep">–</div>
      <div class="reel-wrapper">
        <div class="reel" id="reel1">
          <div class="reel-strip" id="strip1"></div>
          <div class="reel-center-line"></div>
        </div>
      </div>
      <div class="reel-sep">–</div>
      <div class="reel-wrapper">
        <div class="reel" id="reel2">
          <div class="reel-strip" id="strip2"></div>
          <div class="reel-center-line"></div>
        </div>
      </div>
    </div>

    <div class="result-box">
      <div class="result-number" id="resultNumber">000</div>
      <div class="result-label" id="resultLabel">กด "ปั่น" เพื่อเริ่มจับสลาก</div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">🎲 ปั่นสลาก</button>
  </div>

  <div class="history">
    <p class="history-title">ผลการจับสลากล่าสุด</p>
    <div class="history-list" id="historyList">
      <span style="color:var(--muted);font-size:.8rem;font-family:'Kanit',sans-serif;">ยังไม่มีการจับสลาก</span>
    </div>
    <button class="clear-btn" onclick="clearHistory()">ล้างประวัติ</button>
  </div>

</div>

<script src="main.js"></script>
</body>
</html>
