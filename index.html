<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จับสลากรางวัล — วงล้อ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti"></canvas>
<div class="win-flash" id="winFlash"></div>

<!-- Result Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <p class="modal-sub">ผลการจับสลาก</p>
    <p class="modal-label">หมายเลขที่ได้รับคือ</p>
    <div class="modal-number" id="modalNumber">—</div>
    <button class="modal-close" onclick="closeModal()">✓ รับทราบ</button>
  </div>
</div>

<div class="wrapper">

  <div class="header">
    <p class="eyebrow">ระบบจับสลาก</p>
    <h1>🎡 วงล้อ<span>สลาก</span>รางวัล</h1>
  </div>

  <!-- Wheel -->
  <div class="wheel-section">
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎲 หมุนวงล้อ</button>
  </div>

  <!-- Number Manager -->
  <div class="manager">
    <p class="manager-title">จัดการหมายเลขในวงล้อ</p>
    <div class="add-row">
      <input class="add-input" id="numInput" type="text"
        placeholder="พิมพ์เลข หรือข้อความ..."
        maxlength="10"
        onkeydown="if(event.key==='Enter') addNumber()">
      <button class="add-btn" onclick="addNumber()">+ เพิ่ม</button>
    </div>
    <div class="chips-grid" id="chipsGrid">
      <span class="chips-empty">ยังไม่มีหมายเลข — เพิ่มด้านบนได้เลย</span>
    </div>
    <div class="presets">
      <span class="preset-label">เพิ่มด่วน:</span>
      <button class="preset-btn" onclick="addPreset('000-099')">000–099</button>
      <button class="preset-btn" onclick="addPreset('100-199')">100–199</button>
      <button class="preset-btn" onclick="addPreset('200-299')">200–299</button>
      <button class="clear-all-btn" onclick="clearAll()">ล้างทั้งหมด</button>
    </div>
  </div>

  <!-- History -->
  <div class="history">
    <p class="history-title">ผลล่าสุด</p>
    <div class="history-list" id="historyList">
      <span style="color:var(--muted);font-size:.8rem;">ยังไม่มีผล</span>
    </div>
    <button class="history-clear" onclick="clearHistory()">ล้างประวัติ</button>
  </div>

</div>

<script src="main.js"></script>
</body>
</html>
